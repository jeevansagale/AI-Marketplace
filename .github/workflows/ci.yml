name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, controlplane]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        working-directory: apps/${{ matrix.service }}
        run: go build ./...
      - name: Vet
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run build